<svg xmlns="http://www.w3.org/2000/svg" width="114" height="24" viewBox="0 0 114 24" role="img" aria-label="INVESTIGATION" font-family="ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
